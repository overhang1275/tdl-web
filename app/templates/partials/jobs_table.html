{% if jobs %}
<table>
  <thead><tr><th>ID</th><th>Chat</th><th>Stage</th><th>Status</th><th>Mensajes</th><th>Archivos</th><th></th></tr></thead>
  <tbody>
    {% for job in jobs %}
    <tr>
      <td>#{{ job.id }}</td>
      <td>{{ job.chat_title or job.chat_id }}</td>
      <td><span class="pill">{{ job.stage.value }}</span></td>
      <td>{{ job.status.value }}</td>
      <td>{{ job.total_filtered_messages }}</td>
      <td>{{ job.total_downloaded_files }}</td>
      <td><a href="/jobs/{{ job.id }}">Abrir</a></td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% else %}
<p>No hay jobs todavía.</p>
{% endif %}
